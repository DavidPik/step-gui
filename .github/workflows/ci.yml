name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.22"

    - name: Build backend
      run: go build ./cmd/gui-backend

    - name: Build Docker image
      run: docker build -t step-gui -f build/Dockerfile .
